version: '3.8'

services:
  # 1. Database Service (PostgreSQL)
  postgres:
    image: postgres:15
    container_name: financesmjo-db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: financesmjo
    volumes:
      # Persist data to local folder
      - ../postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: always

  # 2. Backend Service (Spring Boot)
  backend:
    build: ../backend
    container_name: financesmjo-backend
    ports:
      - "8080:8080" # Optional: Expose for testing, Nginx uses internal network
    environment:
      # Connect to 'postgres' service defined above
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/financesmjo
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: mypassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update # Auto-create tables (change to validate in prod)
    depends_on:
      - postgres
    networks:
      - app-network
    restart: always

  # 3. Frontend Service (Nginx serving React)
  frontend:
    build: ../frontend
    container_name: financesmjo-frontend
    ports:
      - "80:80" # Expose Web Server on port 80
    volumes:
      # Mount custom Nginx config
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - app-network
    restart: always

  # 4. Jenkins Service (CI/CD)
  jenkins:
    build: ./jenkins
    container_name: homesmjo-jenkins
    user: root # Run as root to access docker socket easily
    ports:
      - "9090:8080"
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Docker-outside-of-Docker
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge
